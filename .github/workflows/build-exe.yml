name: Automated Windows EXE Cloud Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-windows-executable:
    runs-on: windows-latest  # Spins up a native Windows Server container in the cloud

    steps:
    - name: Checkout Source Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Runtime (3.10)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Ingestion Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Execute PyInstaller Compilation Node
      run: |
        python setup_installer.py

    - name: Archive and Package Production Binary Asset
      uses: actions/upload-artifact@v4
      with:
        name: ChildSafetyGuard-Windows-EXE
        path: dist/ChildSafetyTriageGuard.exe
        retention-days: 7
